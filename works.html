  /* 태그 라벨 (지금은 프로토타입이라 위치 확인용으로 보여줌) */

  /* 호버 시 선명하게 뜨는 사진 — goo 블러 필터가 안 걸린 별도 레이어 */

  @media (max-width: 640px) {

    .code-nav .fn { display: none; }

    .code-nav a { margin-right: 10px; }

    .page-title { left: 16px !important; top: 64px !important; }
    #hover-photo { width: 30vmin; height: 30vmin; top: 76px; right: 20px; }
  }
</style>

<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
// ============================================
// STEP 4: tag based clustering — "tear map canvas"
// ============================================

// --- artwork data ---
const WORKS = [
  { title: "Proof of Tears",          tags: ["MR", "sound", "sculpture", "capital", "tear", "emotion"], zone: "emosmiths", img: "https://picsum.photos/seed/prooftears/300/300" },
  { title: "Mindful Resonance",       tags: ["MR", "sketch", "sound", "resonance", "ritual", "meditation"], zone: "interactive", img: "https://picsum.photos/seed/mindfulres/300/300" },
  { title: "The Chimes — Spring v01", tags: ["audio-visual", "gesture", "synthesis", "nature"], zone: "interactive", img: "https://picsum.photos/seed/chimes/300/300" },
  { title: "Are We Feeling The Same?",tags: ["machine-learning", "speech", "voice", "emotion", "cross-cultural", "data"], zone: "research", img: "https://picsum.photos/seed/feelingsame/300/300" },
  { title: "Between Clap and Slap",   tags: ["machine-learning", "sound", "gesture", "perception", "data"], zone: "research", img: "https://picsum.photos/seed/clapslap/300/300" },
  { title: "Liminal Rock",            tags: ["sketch", "VR", "emotion"], zone: "interactive", img: "https://picsum.photos/seed/liminalrock/300/300" },
  { title: "Read My Face Out Loud",   tags: ["audio-visual", "gesture", "synthesis", "emotion"], zone: "interactive", img: "https://picsum.photos/seed/readmyface/300/300" },
  { title: "Gaslighting",             tags: ["physical-computing", "perception", "power"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/gaslighting/300/300" },
  { title: "Asian Women vs Women in Asia", tags: ["audio-visual", "cross-cultural", "feminism", "data", "performance"], series: "Neither 0 Nor 1", zone: "rNeither 0 Nor 1", img: "https://picsum.photos/seed/asianwomen/300/300" },
  { title: "The Freelancer, Never Feeling Free", tags: ["songwriting", "identity", "performance"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/freelancer/300/300" },
  { title: "AI: An Imposter or Improver?", tags: ["film", "documentary", "AI"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/aiimposter/300/300" },

  // Music: 
  { title: "BOSS", tags: ["release", "single"], zone: "music", img: "https://picsum.photos/seed/bossqrian/300/300" },
  { title: "QRIAN (EP)", tags: ["release", "EP", "cross-cultural"], zone: "music", img: "https://picsum.photos/seed/qrianep/300/300" },
  { title: "With This", tags: ["release", "single", "debut"], zone: "music", img: "https://picsum.photos/seed/withthis/300/300" },
  { title: "BYULGORAE", tags: ["performance", "curation", "liveevent"], zone: "music", img: "https://picsum.photos/seed/byulgorae/300/300" },

  // Collaboration
  { title: "Lunar Abyss", tags: ["collaborative", "mediafacade", "projectionmapping"], zone: "collaboration", img: "https://picsum.photos/seed/lunarabyss/300/300" },
  { title: "The Planet Of Pets", tags: ["collaborative", "interactive", "mediawall"], zone: "collaboration", img: "https://picsum.photos/seed/planetofpets/300/300" },
  { title: "Meme Machine", tags: ["AI", "culture", "bias", "classification", "data", "power"], zone: "collaboration", img: "https://picsum.photos/seed/mememachine/300/300" },
];

let nodes = [];       // each physics state
let tooltip;

const BG = [10, 13, 18];
const BLOB_COLOR = [188, 228, 230];

// side bar changes for mobile
function sidebarOffsetX() {
  return window.innerWidth <= 640 ? 0 : 280;
}
function sidebarOffsetY() {
  return window.innerWidth <= 640 ? 70 : 0;
}

function setup() {
  let canvas = createCanvas(windowWidth, windowHeight);
  pixelDensity(2);
  canvas.parent(document.body);
  canvas.style('position', 'fixed');
  canvas.style('top', '0');
  canvas.style('left', '0');
  canvas.id('gooey-layer');
  canvas.style('filter', 'url(#goo)');

  tooltip = document.getElementById('tooltip');

  // no fixed axis for networked works
  nodes = WORKS.map((w, i) => {
    let angle = (i / WORKS.length) * TWO_PI;
    let startRadius = 120;
    return {
      title: w.title,
      tags: w.tags,
      series: w.series || null,
      zone: w.zone || null,
      x: sidebarOffsetX() + (width - sidebarOffsetX()) * 0.38 + cos(angle) * startRadius + random(-20, 20),
      y: sidebarOffsetY() + (height - sidebarOffsetY()) / 2 + sin(angle) * startRadius + random(-20, 20),
      vx: 0,
      vy: 0,
      r: 5 + w.tags.length * 0.6,
      breatheOffset: random(TWO_PI),
      imgUrl: w.img
    };
  });

  frameRate(28);

  // aviod if preview pannel size is set too late after setup() 
  setTimeout(() => resizeCanvas(windowWidth, windowHeight), 150);
}

// the number of the shared tags
function sharedTagCount(a, b) {
  return a.tags.filter(t => b.tags.includes(t)).length;
}

// Jaccard similarity for the shared tags 
function tagSimilarity(a, b) {
  let shared = sharedTagCount(a, b);
  if (shared === 0) return 0;
  let unionSize = new Set([...a.tags, ...b.tags]).size;
  return shared / unionSize; // 0~1
}

// tear drop dots
function teardropPath(cx, cy, r) {
  let w = r * 1.3;   // width
  let h = r * 1.5;   // height 
  let top = cy - h / 2;
  let bottom = cy + h / 2;
  drawingContext.beginPath();
  drawingContext.moveTo(cx, top); // 맨 위 뾰족한 점
  drawingContext.bezierCurveTo(cx + w / 2, cy - h * 0.08, cx + w / 2, cy + h * 0.32, cx, bottom);
  drawingContext.bezierCurveTo(cx - w / 2, cy + h * 0.32, cx - w / 2, cy - h * 0.08, cx, top);
  drawingContext.closePath();
}

function draw() {
  blendMode(BLEND);
  background(BG[0], BG[1], BG[2]);
  noStroke();
  blendMode(ADD);

  // connected threads for the shared tags 
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      let a = nodes[i], b = nodes[j];
      let sim = tagSimilarity(a, b);
      if (sim <= 0) continue;

      let isSeriesMate = a.series && a.series === b.series;
      let boost = isSeriesMate ? 1.6 : 1; // series being more noiceable

      stroke(BLOB_COLOR[0], BLOB_COLOR[1], BLOB_COLOR[2], constrain(sim * 110 * boost, 10, 90));
      strokeWeight(constrain(sim * 2.5 * boost, 0.6, 2.8));
      line(a.x, a.y, b.x, b.y);
    }
  }
  noStroke();

  let hovered = null;

  for (let n of nodes) {
    // no specific fixed axis - adjusting the gravity depending on the relationships 
    for (let other of nodes) {
      if (other === n) continue;
      let dx = other.x - n.x;
      let dy = other.y - n.y;
      let d = constrain(mag(dx, dy), 20, 2000); // avoid to divide by 0 + limiting when its too far

      // more distanced, getting weaker (Coulomb's law)
      let repel = 16000 / (d * d);
      n.vx -= (dx / d) * repel;
      n.vy -= (dy / d) * repel;

      // more overlapped tags - gravity like sprung
      let sim = tagSimilarity(n, other);
      if (sim > 0) {
        let pull = sim * d * 0.00035;
        n.vx += (dx / d) * pull;
        n.vy += (dy / d) * pull;
      }

      // same series - stronger gravity like unity 
      if (n.series && other.series === n.series) {
        let seriesPull = d * 0.0012;
        n.vx += (dx / d) * seriesPull;
        n.vy += (dy / d) * seriesPull;
      }
    }

    // in the middle - suble gravity
    let centerX = sidebarOffsetX() + (width - sidebarOffsetX()) * 0.38;
    let centerY = sidebarOffsetY() + (height - sidebarOffsetY()) / 2;
    n.vx += (centerX - n.x) * 0.00006;
    n.vy += (centerY - n.y) * 0.00006;

    // section gravitiy — tags base

    n.vx *= 0.88; // declining — gradually
    n.vy *= 0.88;
    n.x += n.vx;
    n.y += n.vy;

    // network shape like globe
    let maxRadius = min(width - sidebarOffsetX(), height - sidebarOffsetY()) / 2 - 40;
    let dx2 = n.x - centerX;
    let dy2 = n.y - centerY;
    let distFromCenter = mag(dx2, dy2);
    if (distFromCenter > maxRadius) {
      let scale = maxRadius / distFromCenter;
      n.x = centerX + dx2 * scale;
      n.y = centerY + dy2 * scale;
    }

    // breathing size
    let breathe = sin(frameCount * 0.02 + n.breatheOffset) * 3;
    let displayR = n.r + breathe / 2;

    let isHover = dist(mouseX, mouseY, n.x, n.y) < n.r;
    if (isHover) hovered = n;

    // additive glow
    blendMode(ADD);
    noStroke();
    teardropPath(n.x, n.y, displayR + 3);
    drawingContext.fillStyle = `rgba(${BLOB_COLOR[0]}, ${BLOB_COLOR[1]}, ${BLOB_COLOR[2]}, ${(isHover ? 90 : 50) / 255})`;
    drawingContext.fill();

    // basic mode - no pic but only spot
    blendMode(BLEND);
    teardropPath(n.x, n.y, displayR);
    drawingContext.fillStyle = `rgba(${BLOB_COLOR[0]}, ${BLOB_COLOR[1]}, ${BLOB_COLOR[2]}, ${(isHover ? 210 : 140) / 255})`;
    drawingContext.fill();
  }

  // corner big tear spot + pointer tip 
  const hoverImg = document.getElementById('hover-img');

  if (hovered) {
    tooltip.innerText = hovered.title + "  ·  " + hovered.tags.map(t => "#" + t).join(" ");
    tooltip.style.left = hovered.x + 'px';
    tooltip.style.top = hovered.y + 'px';
    tooltip.style.opacity = 1;
    document.body.style.cursor = 'pointer';

    // corner big tear spot - changing the main pictures 
    if (hoverImg.src !== hovered.imgUrl) hoverImg.src = hovered.imgUrl;
    hoverImg.classList.add('active');
  } else {
    tooltip.style.opacity = 0;
    hoverImg.classList.remove('active');
    document.body.style.cursor = 'default';
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>

<!-- blur only for the follower (not for the map canvas — id should not be overlapped!) -->
<svg style="position:absolute; width:0; height:0;">
  <filter id="goo-cursor">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="soft" />
  </filter>
</svg>

<script>
// tear follower — separate layer from the map canvas
// instance — not to overlapp with th setup()/draw() of the map canvas
new p5(function (p) {
  let followerX, followerY;
  let followerVX = 0, followerVY = 0;
  const F_SPRING = 0.035;
  const F_DAMPING = 0.72;
  let followerTrail = [];
  const F_TRAIL_LENGTH = 6;
  const F_COLOR = [188, 228, 230];

  p.setup = function () {
    let canvas = p.createCanvas(window.innerWidth, window.innerHeight);
    p.pixelDensity(2);
    canvas.parent(document.body);
    canvas.id('cursor-layer');
    canvas.style('position', 'fixed');
    canvas.style('top', '0');
    canvas.style('left', '0');
    canvas.style('z-index', '7');
    canvas.style('pointer-events', 'none');
    canvas.style('filter', 'url(#goo-cursor)');
    followerX = p.width / 2;
    followerY = p.height / 2;
    p.frameRate(30);
  };

  p.draw = function () {
    p.clear();

    let ax = (p.mouseX - followerX) * F_SPRING;
    let ay = (p.mouseY - followerY) * F_SPRING;
    followerVX = (followerVX + ax) * F_DAMPING;
    followerVY = (followerVY + ay) * F_DAMPING;
    followerX += followerVX;
    followerY += followerVY;

    followerTrail.push({ x: followerX, y: followerY });
    if (followerTrail.length > F_TRAIL_LENGTH) followerTrail.shift();

    p.blendMode(p.ADD);
    p.noFill();
    p.strokeCap(p.ROUND);
    p.strokeJoin(p.ROUND);
    for (let i = 0; i < followerTrail.length - 1; i++) {
      let t = i / followerTrail.length;
      let a = followerTrail[i];
      let b = followerTrail[i + 1];
      p.stroke(F_COLOR[0], F_COLOR[1], F_COLOR[2], 65 * t);
      p.strokeWeight(26);
      p.line(a.x, a.y, b.x, b.y);
    }
    p.noStroke();

    let speed = p.mag(followerVX, followerVY);
    let angle = p.atan2(followerVY, followerVX);
    let stretch = p.constrain(speed * 0.22, 0, 10);
    let breathe = 20 + p.sin(p.frameCount * 0.02) * 3;

    p.push();
    p.translate(followerX, followerY);
    p.rotate(angle);
    p.fill(F_COLOR[0], F_COLOR[1], F_COLOR[2], 150);
    p.ellipse(0, 0, breathe + stretch, breathe - stretch * 0.5);
    p.pop();
  };

  p.windowResized = function () {
    p.resizeCanvas(window.innerWidth, window.innerHeight);
  };
});
</script>
</body>
