<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
// ============================================
// STEP 4: 태그 기반 클러스터링 — "눈물들의 지도"
// ============================================

// --- 가상의 작업 데이터 (나중에 실제 프로젝트로 교체) ---
const WORKS = [
  { title: "Proof of Tears",          tags: ["MR", "sound", "resonance", "capital", "biometric-trace"], zone: "interactive", img: "https://picsum.photos/seed/prooftears/300/300" },
  { title: "Mindful Resonance",       tags: ["MR", "sound", "resonance", "ritual"], zone: "interactive", img: "https://picsum.photos/seed/mindfulres/300/300" },
  { title: "The Chimes — Spring v01", tags: ["sound", "gesture", "synthesis", "nature"], zone: "interactive", img: "https://picsum.photos/seed/chimes/300/300" },
  { title: "Are We Feeling The Same?",tags: ["sound", "voice", "cross-cultural", "machine-learning"], zone: "research", img: "https://picsum.photos/seed/feelingsame/300/300" },
  { title: "Between Clap and Slap",   tags: ["sound", "gesture", "machine-learning", "perception"], zone: "research", img: "https://picsum.photos/seed/clapslap/300/300" },
  { title: "Liminal Rock",            tags: ["MR", "narrative", "emotion"], zone: "interactive", img: "https://picsum.photos/seed/liminalrock/300/300" },
  { title: "Meme Machine",            tags: ["machine-learning", "culture", "bias", "classification"], zone: "research", img: "https://picsum.photos/seed/mememachine/300/300" },
  { title: "Read My Face Out Loud",   tags: ["sound", "biometric-trace", "gesture"], zone: "interactive", img: "https://picsum.photos/seed/readmyface/300/300" },
  { title: "Gaslighting",             tags: ["culture", "bias", "identity"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/gaslighting/300/300" },
  { title: "Asian Women vs Women in Asia", tags: ["culture", "identity"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/asianwomen/300/300" },
  { title: "The Freelancer, Never Feeling Free", tags: ["culture", "identity", "capital"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/freelancer/300/300" },
  { title: "AI: An Imposter or Improver?", tags: ["machine-learning", "bias", "identity"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/aiimposter/300/300" },

  // --- Music: 독립 트랙/공연도 같은 지도 안에, 태그로 자연스럽게 연결됨 ---
  { title: "BOSS", tags: ["sound", "voice", "avant-pop", "release"], zone: "music", img: "https://picsum.photos/seed/bossqrian/300/300" },
  { title: "QRIAN (EP)", tags: ["sound", "voice", "avant-pop", "release"], zone: "music", img: "https://picsum.photos/seed/qrianep/300/300" },
  { title: "With This", tags: ["sound", "voice", "release"], zone: "music", img: "https://picsum.photos/seed/withthis/300/300" },
  { title: "BYULGORAE", tags: ["sound", "performance", "curation"], zone: "music", img: "https://picsum.photos/seed/byulgorae/300/300" },

  // --- 협업 작업 — 실제 사이트에서 확인됨, 태그/설명은 아직 임시 ---
  // TODO: 실제 내용 확인 후 태그 다시 잡기
  { title: "Lunar Abyss", tags: ["collaboration"], zone: "collaboration", img: "https://picsum.photos/seed/lunarabyss/300/300" },
  { title: "The Planet Of Pets", tags: ["collaboration"], zone: "collaboration", img: "https://picsum.photos/seed/planetofpets/300/300" },
];

let nodes = [];       // 각 작업의 물리 상태
let tooltip;

const BG = [10, 13, 18];
const BLOB_COLOR = [188, 228, 230];

// 사이드바가 모바일에서는 왼쪽이 아니라 위쪽 얇은 바로 바뀌므로,
// 지도 중심/경계 계산도 그에 맞게 반응하게 함
function sidebarOffsetX() {
  return window.innerWidth <= 640 ? 0 : 280;
}
function sidebarOffsetY() {
  return window.innerWidth <= 640 ? 70 : 0;
}

function setup() {
  let canvas = createCanvas(windowWidth, windowHeight);
  pixelDensity(2);
  canvas.parent(document.body);
  canvas.style('position', 'fixed');
  canvas.style('top', '0');
  canvas.style('left', '0');
  canvas.id('gooey-layer');
  canvas.style('filter', 'url(#goo)');

  tooltip = document.getElementById('tooltip');

  // 각 작업을 화면 중앙 근처에 원형으로 흩뿌려서 시작 — 여기서부터
  // 서로 끌고 밀며 스스로 지형을 만들어감 (고정된 축이 없음)
  nodes = WORKS.map((w, i) => {
    let angle = (i / WORKS.length) * TWO_PI;
    let startRadius = 120;
    return {
      title: w.title,
      tags: w.tags,
      series: w.series || null,
      zone: w.zone || null,
      x: sidebarOffsetX() + (width - sidebarOffsetX()) * 0.38 + cos(angle) * startRadius + random(-20, 20),
      y: sidebarOffsetY() + (height - sidebarOffsetY()) / 2 + sin(angle) * startRadius + random(-20, 20),
      vx: 0,
      vy: 0,
      r: 5 + w.tags.length * 0.6,
      breatheOffset: random(TWO_PI),
      imgUrl: w.img
    };
  });

  frameRate(28);

  // 프리뷰 패널 크기가 setup() 직후에 늦게 확정되는 경우를 대비한 안전장치
  setTimeout(() => resizeCanvas(windowWidth, windowHeight), 150);
}

// 두 작업이 공유하는 태그 개수
function sharedTagCount(a, b) {
  return a.tags.filter(t => b.tags.includes(t)).length;
}

// 태그 겹침 "비율" (자카드 유사도) — 둘 다 태그가 많으면 겹쳐도 비율은 낮아짐
// 이래야 "sound"처럼 흔한 태그 하나로 다 같이 뭉치는 걸 막을 수 있음
function tagSimilarity(a, b) {
  let shared = sharedTagCount(a, b);
  if (shared === 0) return 0;
  let unionSize = new Set([...a.tags, ...b.tags]).size;
  return shared / unionSize; // 0~1
}

// 세로형 눈물 실루엣 경로 — 위는 뾰족, 아래는 둥글게
// (raw canvas 경로라서 채우기/클리핑 둘 다에 재사용 가능)
function teardropPath(cx, cy, r) {
  let w = r * 1.3;   // 폭
  let h = r * 1.5;   // 높이 (훨씬 덜 길쭉하게 — 더 동글동글)
  let top = cy - h / 2;
  let bottom = cy + h / 2;
  drawingContext.beginPath();
  drawingContext.moveTo(cx, top); // 맨 위 뾰족한 점
  drawingContext.bezierCurveTo(cx + w / 2, cy - h * 0.08, cx + w / 2, cy + h * 0.32, cx, bottom);
  drawingContext.bezierCurveTo(cx - w / 2, cy + h * 0.32, cx - w / 2, cy - h * 0.08, cx, top);
  drawingContext.closePath();
}

function draw() {
  blendMode(BLEND);
  background(BG[0], BG[1], BG[2]);
  noStroke();
  blendMode(ADD);

  // 태그가 겹치는 모든 쌍을 실로 연결 — 지도 전체가 하나의 유기적 그물망이 되게
  // 겹침이 강할수록(비슷할수록) 더 굵고 선명하게
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      let a = nodes[i], b = nodes[j];
      let sim = tagSimilarity(a, b);
      if (sim <= 0) continue;

      let isSeriesMate = a.series && a.series === b.series;
      let boost = isSeriesMate ? 1.6 : 1; // 시리즈는 그물망 안에서도 살짝 더 도드라지게

      stroke(BLOB_COLOR[0], BLOB_COLOR[1], BLOB_COLOR[2], constrain(sim * 110 * boost, 10, 90));
      strokeWeight(constrain(sim * 2.5 * boost, 0.6, 2.8));
      line(a.x, a.y, b.x, b.y);
    }
  }
  noStroke();

  let hovered = null;

  for (let n of nodes) {
    // 1) 다른 모든 작업과의 관계로 힘을 계산 (고정된 축이 없음 — 관계 자체가 지형을 만듦)
    for (let other of nodes) {
      if (other === n) continue;
      let dx = other.x - n.x;
      let dy = other.y - n.y;
      let d = constrain(mag(dx, dy), 20, 2000); // 0으로 나눠지는 것 방지 + 너무 먼 경우 제한

      // 반발력: 항상 작동, 거리가 멀수록 약해짐 (Coulomb's law 방식)
      let repel = 16000 / (d * d);
      n.vx -= (dx / d) * repel;
      n.vy -= (dy / d) * repel;

      // 끌어당김: 태그 겹침 "비율"이 높을수록, 그리고 멀리 있을수록 세게 (스프링처럼)
      let sim = tagSimilarity(n, other);
      if (sim > 0) {
        let pull = sim * d * 0.00035;
        n.vx += (dx / d) * pull;
        n.vy += (dy / d) * pull;
      }

      // 같은 시리즈면 훨씬 강하게 끌어당김 — 태그 유사성보다 우선하는 "가족" 결속
      if (n.series && other.series === n.series) {
        let seriesPull = d * 0.0012;
        n.vx += (dx / d) * seriesPull;
        n.vy += (dy / d) * seriesPull;
      }
    }

    // 2) 화면 중앙(사이드바 피해서 오른쪽으로)으로의 아주 약한 중력
    let centerX = sidebarOffsetX() + (width - sidebarOffsetX()) * 0.38;
    let centerY = sidebarOffsetY() + (height - sidebarOffsetY()) / 2;
    n.vx += (centerX - n.x) * 0.00006;
    n.vy += (centerY - n.y) * 0.00006;

    // 2.5) (구역 끌림 기능 제거 — 순수 태그 기반 관계로만 자리 잡음)

    n.vx *= 0.88; // 감쇠 — 진동하지 않고 서서히 자리 잡도록
    n.vy *= 0.88;
    n.x += n.vx;
    n.y += n.vy;

    // 안전장치: 사각형 대신 원형 경계 — 지구본처럼 둥글게 가둠
    let maxRadius = min(width - sidebarOffsetX(), height - sidebarOffsetY()) / 2 - 40;
    let dx2 = n.x - centerX;
    let dy2 = n.y - centerY;
    let distFromCenter = mag(dx2, dy2);
    if (distFromCenter > maxRadius) {
      let scale = maxRadius / distFromCenter;
      n.x = centerX + dx2 * scale;
      n.y = centerY + dy2 * scale;
    }

    // 숨쉬는 크기 (기존 앰비언트 블롭과 같은 리듬 언어)
    let breathe = sin(frameCount * 0.02 + n.breatheOffset) * 3;
    let displayR = n.r + breathe / 2;

    let isHover = dist(mouseX, mouseY, n.x, n.y) < n.r;
    if (isHover) hovered = n;

    // 3) 뒤에 은은한 additive 글로우 (물기 느낌) — 세로형 눈물 모양
    blendMode(ADD);
    noStroke();
    teardropPath(n.x, n.y, displayR + 3);
    drawingContext.fillStyle = `rgba(${BLOB_COLOR[0]}, ${BLOB_COLOR[1]}, ${BLOB_COLOR[2]}, ${(isHover ? 90 : 50) / 255})`;
    drawingContext.fill();

    // 4) 기본 상태에서는 사진을 넣지 않음 — 작고 은은한 점으로만 존재
    //    (사진은 호버했을 때 별도의 선명한 레이어로만 나타남, 아래 참고)
    //    이래야 "몇 개를 확대해서 보는" 느낌이 아니라 "넓은 지도를 조망하는" 느낌이 남
    blendMode(BLEND);
    teardropPath(n.x, n.y, displayR);
    drawingContext.fillStyle = `rgba(${BLOB_COLOR[0]}, ${BLOB_COLOR[1]}, ${BLOB_COLOR[2]}, ${(isHover ? 210 : 140) / 255})`;
    drawingContext.fill();
  }

  // 툴팁 + 코너의 눈물 점 → 사진 전환
  const hoverImg = document.getElementById('hover-img');

  if (hovered) {
    tooltip.innerText = hovered.title + "  ·  " + hovered.tags.map(t => "#" + t).join(" ");
    tooltip.style.left = hovered.x + 'px';
    tooltip.style.top = hovered.y + 'px';
    tooltip.style.opacity = 1;
    document.body.style.cursor = 'pointer';

    // 코너의 기본 눈물 점이 사진으로 샥샥 전환됨 (위치는 고정)
    if (hoverImg.src !== hovered.imgUrl) hoverImg.src = hovered.imgUrl;
    hoverImg.classList.add('active');
  } else {
    tooltip.style.opacity = 0;
    hoverImg.classList.remove('active');
    document.body.style.cursor = 'default';
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>

<!-- 팔로워 전용 강한 블러 (지도용 필터랑 별개 — id 겹치면 안 됨) -->
<svg style="position:absolute; width:0; height:0;">
  <filter id="goo-cursor">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="soft" />
  </filter>
</svg>

<script>
// 커서 눈물 팔로워 — 지도 캔버스랑 분리된 별도 레이어, 인덱스와 같은 강한 블러로 은은하게
// 인스턴스 모드로 작성 — 지도 스크립트의 setup()/draw()와 이름이 겹치면 서로 덮어써버리기 때문
new p5(function (p) {
  let followerX, followerY;
  let followerVX = 0, followerVY = 0;
  const F_SPRING = 0.035;
  const F_DAMPING = 0.72;
  let followerTrail = [];
  const F_TRAIL_LENGTH = 6;
  const F_COLOR = [188, 228, 230];

  p.setup = function () {
    let canvas = p.createCanvas(window.innerWidth, window.innerHeight);
    p.pixelDensity(2);
    canvas.parent(document.body);
    canvas.id('cursor-layer');
    canvas.style('position', 'fixed');
    canvas.style('top', '0');
    canvas.style('left', '0');
    canvas.style('z-index', '7');
    canvas.style('pointer-events', 'none');
    canvas.style('filter', 'url(#goo-cursor)');
    followerX = p.width / 2;
    followerY = p.height / 2;
    p.frameRate(30);
  };

  p.draw = function () {
    p.clear();

    let ax = (p.mouseX - followerX) * F_SPRING;
    let ay = (p.mouseY - followerY) * F_SPRING;
    followerVX = (followerVX + ax) * F_DAMPING;
    followerVY = (followerVY + ay) * F_DAMPING;
    followerX += followerVX;
    followerY += followerVY;

    followerTrail.push({ x: followerX, y: followerY });
    if (followerTrail.length > F_TRAIL_LENGTH) followerTrail.shift();

    p.blendMode(p.ADD);
    p.noFill();
    p.strokeCap(p.ROUND);
    p.strokeJoin(p.ROUND);
    for (let i = 0; i < followerTrail.length - 1; i++) {
      let t = i / followerTrail.length;
      let a = followerTrail[i];
      let b = followerTrail[i + 1];
      p.stroke(F_COLOR[0], F_COLOR[1], F_COLOR[2], 65 * t);
      p.strokeWeight(26);
      p.line(a.x, a.y, b.x, b.y);
    }
    p.noStroke();

    let speed = p.mag(followerVX, followerVY);
    let angle = p.atan2(followerVY, followerVX);
    let stretch = p.constrain(speed * 0.22, 0, 10);
    let breathe = 20 + p.sin(p.frameCount * 0.02) * 3;

    p.push();
    p.translate(followerX, followerY);
    p.rotate(angle);
    p.fill(F_COLOR[0], F_COLOR[1], F_COLOR[2], 150);
    p.ellipse(0, 0, breathe + stretch, breathe - stretch * 0.5);
    p.pop();
  };

  p.windowResized = function () {
    p.resizeCanvas(window.innerWidth, window.innerHeight);
  };
});
</script>
