<style>
  html, body {
    margin: 0;

  #gooey-layer {

  #tooltip {

    color: #0A0D12;
    background: #E8ECEF;

    font-size: 12px;

  .sidebar {
    position: fixed;
    top: 0; left: 0;
    height: 100%;
    width: 280px;
    z-index: 10;
    padding: 48px 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(10,13,18,0.35) 0%, rgba(10,13,18,0.15) 70%, transparent 100%);
  }
  .logo {
    font-family: 'Space Mono', monospace;

    letter-spacing: -0.02em;
    color: #F0F4F5;
    text-decoration: none;

  }
  .code-nav .fn { color: #8A9AA0; }
  .code-nav a {
    color: #BCE4E6;
    text-decoration: none;
    display: inline-block;
    transform-origin: left center;
    transition: transform 0.2s ease;
  }
  .code-nav a:hover { transform: scale(1.06); }
  .footer-links {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #8A9AA0;
    white-space: nowrap;
    text-shadow: 0 2px 12px rgba(10,13,18,0.9);
  }
  .footer-links a { color: inherit; text-decoration: none; }
  .footer-links a:hover { color: #BCE4E6; }

  #hover-photo {
    position: fixed;
    top: 40px;
    right: 48px;
    z-index: 8;
    width: 32vmin;
    height: 32vmin;
    min-width: 180px;
    min-height: 180px;
    max-width: 320px;
    max-height: 320px;
    overflow: hidden;
    pointer-events: none;
    -webkit-mask-image: radial-gradient(circle closest-side, black 40%, transparent 95%);

  #hover-photo .blob-bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(188,228,230,0.4), rgba(188,228,230,0.06) 70%);
  }
  #hover-photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  #hover-photo img.active { opacity: 1; }

  #hover-caption {
    position: fixed;
    z-index: 8;
    text-align: right;
    font-family: 'Space Mono', monospace;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #hover-caption .title {
    font-size: 14px;
    color: #E8ECEF;
    margin-bottom: 4px;
  }
  #hover-caption .keywords {
    font-size: 11px;
    color: #7A9EA8;
    letter-spacing: 0.02em;
  }
  #hover-caption.active { opacity: 1; }

  @media (max-width: 640px) {
    .sidebar {
      width: 100%;
      height: auto;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(10,13,18,0.85);
    }
    .logo { font-size: 20px; }
    .code-nav { font-size: 13px; margin-top: 0 !important; line-height: 1.3; }
    .code-nav .fn { display: none; }
    .code-nav br { display: none; }
    .code-nav a { margin-right: 10px; }
    .footer-links { display: none; }
    #hover-photo { width: 30vmin; height: 30vmin; top: 76px; right: 20px; }
  }
</style>

<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
const WORKS = [

  { title: "Mindful Resonance",       tags: ["MR", "sketch", "sound", "gesture"], zone: "interactive", img: "https://picsum.photos/seed/mindfulres/300/300" },
  { title: "Spring v01",              tags: ["thechimes", "audio-visual", "gesture", "synthesis"], zone: "interactive", img: "https://picsum.photos/seed/chimes/300/300" },
  { title: "Are We Feeling The Same?",tags: ["machine-learning", "emotion", "cross-cultural", "voice"], zone: "research", img: "https://picsum.photos/seed/feelingsame/300/300" },
  { title: "Between Clap and Slap",   tags: ["machine-learning", "perception", "sound", "gesture"], zone: "research", img: "https://picsum.photos/seed/clapslap/300/300" },
  { title: "Liminal Rock",            tags: ["sketch", "VR", "emotion"], zone: "interactive", img: "https://picsum.photos/seed/liminalrock/300/300" },
  { title: "Read My Face Out Loud",   tags: ["audio-visual", "gesture", "synthesis", "emotion"], zone: "interactive", img: "https://picsum.photos/seed/readmyface/300/300" },
  { title: "Proof of Tears",          tags: ["emosmiths", "installation", "MR", "sound", "voice"], zone: "emosmiths", link: "proof-of-tears.html", img: "https://picsum.photos/seed/prooftears/300/300" },
  
  { title: "Gaslighting",             tags: ["neither0nor1", "physical-computing", "perception", "power"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/gaslighting/300/300" },
  { title: "Asian Women vs Women in Asia", tags: ["neither0nor1", "audio-visual", "cross-cultural", "performance"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/asianwomen/300/300" },
  { title: "The Freelancer, Never Feeling Free", tags: ["neither0nor1", "music", "songwriting", "performance"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/freelancer/300/300" },
  { title: "AI: An Imposter or Improver?", tags: ["neither0nor1", "film", "documentary", "AI"], series: "Neither 0 Nor 1", zone: "research", img: "https://picsum.photos/seed/aiimposter/300/300" },

  { title: "BOSS", tags: ["music", "release", "single"], zone: "music", img: "https://picsum.photos/seed/bossqrian/300/300" },
  { title: "QRIAN (EP)", tags: ["music", "release", "EP", "cross-cultural"], zone: "music", img: "https://picsum.photos/seed/qrianep/300/300" },
  { title: "With This", tags: ["music", "release", "single", "debut"], zone: "music", img: "https://picsum.photos/seed/withthis/300/300" },
  { title: "BYULGORAE", tags: ["music", "performance", "curation", "liveevent"], zone: "music", img: "https://picsum.photos/seed/byulgorae/300/300" },
  
  { title: "Lunar Abyss", tags: ["collaborative", "mediafacade", "projectionmapping"], zone: "collaborative", img: "https://picsum.photos/seed/lunarabyss/300/300" },
  { title: "The Planet Of Pets", tags: ["collaborative", "interactive", "mediawall"], zone: "collaborative", img: "https://picsum.photos/seed/planetofpets/300/300" },
  { title: "Meme Machine", tags: ["collaborative", "AI", "culture", "bias", "classification"], zone: "collaborative", img: "https://picsum.photos/seed/mememachine/300/300" },

];

let nodes = [];
let tooltip;

const BG = [10, 13, 18];
const BLOB_COLOR = [188, 228, 230];

function sidebarOffsetX() {
  return window.innerWidth <= 640 ? 0 : 280;
}
function sidebarOffsetY() {
  return window.innerWidth <= 640 ? 70 : 0;
}

function setup() {
  let canvas = createCanvas(windowWidth, windowHeight);
  pixelDensity(2);
  canvas.parent(document.body);
  canvas.style('position', 'fixed');
  canvas.style('top', '0');
  canvas.style('left', '0');
  canvas.id('gooey-layer');
  canvas.style('filter', 'url(#goo)');

  tooltip = document.getElementById('tooltip');

  nodes = WORKS.map((w, i) => {
    let angle = (i / WORKS.length) * TWO_PI;
    let startRadius = 120;
    return {
      title: w.title,
      tags: w.tags,
      series: w.series || null,
      zone: w.zone || null,
      link: w.link || null,
      pin: w.pin || null,
      x: sidebarOffsetX() + (width - sidebarOffsetX()) * 0.38 + cos(angle) * startRadius + random(-20, 20),
      y: sidebarOffsetY() + (height - sidebarOffsetY()) / 2 + sin(angle) * startRadius + random(-20, 20),
      vx: 0,
      vy: 0,
      r: 5 + w.tags.length * 0.6,
      breatheOffset: random(TWO_PI),
      imgUrl: w.img
    };
  });

  frameRate(28);
  setTimeout(() => resizeCanvas(windowWidth, windowHeight), 150);
}

function sharedTagCount(a, b) {
  return a.tags.filter(t => b.tags.includes(t)).length;
}

function tagSimilarity(a, b) {
  let shared = sharedTagCount(a, b);
  if (shared === 0) return 0;
  let unionSize = new Set([...a.tags, ...b.tags]).size;
  return shared / unionSize;
}

function teardropPath(cx, cy, r) {
  let w = r * 1.3;
  let h = r * 1.5;
  let top = cy - h / 2;
  let bottom = cy + h / 2;
  drawingContext.beginPath();
  drawingContext.moveTo(cx, top);
  drawingContext.bezierCurveTo(cx + w / 2, cy - h * 0.08, cx + w / 2, cy + h * 0.32, cx, bottom);
  drawingContext.bezierCurveTo(cx - w / 2, cy + h * 0.32, cx - w / 2, cy - h * 0.08, cx, top);
  drawingContext.closePath();
}

function draw() {
  blendMode(BLEND);
  background(BG[0], BG[1], BG[2]);
  noStroke();

  let hovered = null;

  for (let n of nodes) {
    for (let other of nodes) {
      if (other === n) continue;
      let dx = other.x - n.x;
      let dy = other.y - n.y;
      let d = constrain(mag(dx, dy), 20, 2000);

      let repel = 9500 / (d * d);
      n.vx -= (dx / d) * repel;
      n.vy -= (dy / d) * repel;

      let sim = tagSimilarity(n, other);
      if (sim > 0) {
        let pull = sim * d * 0.00035;
        n.vx += (dx / d) * pull;
        n.vy += (dy / d) * pull;
      }

      if (n.series && other.series === n.series) {
        let seriesPull = d * 0.0012;
        n.vx += (dx / d) * seriesPull;
        n.vy += (dy / d) * seriesPull;
      }
    }

    let centerX = sidebarOffsetX() + (width - sidebarOffsetX()) * 0.38;
    let centerY = sidebarOffsetY() + (height - sidebarOffsetY()) / 2;
    n.vx += (centerX - n.x) * 0.00012;
    n.vy += (centerY - n.y) * 0.00012;

    if (n.pin) {
      let mapLeft = sidebarOffsetX();
      let mapTop = sidebarOffsetY();
      let mapW = width - mapLeft;
      let mapH = height - mapTop;
      let pinX = mapLeft + mapW * n.pin.x;
      let pinY = mapTop + mapH * n.pin.y;
      n.vx += (pinX - n.x) * 0.0015;
      n.vy += (pinY - n.y) * 0.0015;
    }

    n.vx *= 0.88;
    n.vy *= 0.88;
    n.x += n.vx;
    n.y += n.vy;

    let maxRadius = min(width - sidebarOffsetX(), height - sidebarOffsetY()) / 2 - 40;
    let dx2 = n.x - centerX;
    let dy2 = n.y - centerY;
    let distFromCenter = mag(dx2, dy2);
    if (distFromCenter > maxRadius) {
      let scale = maxRadius / distFromCenter;
      n.x = centerX + dx2 * scale;
      n.y = centerY + dy2 * scale;
    }

    let isHover = dist(mouseX, mouseY, n.x, n.y) < n.r;
    if (isHover) hovered = n;
  }

  // 연결선 — 노드 아래(기본), 알파 최소 15 (전에 25에서 낮춘 값)
  blendMode(ADD);
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      let a = nodes[i], b = nodes[j];
      let sim = tagSimilarity(a, b);
      if (sim <= 0) continue;
      let isSeriesMate = a.series && a.series === b.series;
      let boost = isSeriesMate ? 1.6 : 1;
      stroke(BLOB_COLOR[0], BLOB_COLOR[1], BLOB_COLOR[2], constrain(sim * 110 * boost, 15, 85));
      strokeWeight(constrain(sim * 2.6 * boost, 0.8, 2.3));
      line(a.x, a.y, b.x, b.y);
    }
  }
  noStroke();

  for (let n of nodes) {
    let breathe = sin(frameCount * 0.02 + n.breatheOffset) * 3;
    let displayR = n.r + breathe / 2;
    let isHover = n === hovered;

    blendMode(ADD);
    noStroke();
    teardropPath(n.x, n.y, displayR + 3);
    drawingContext.fillStyle = `rgba(${BLOB_COLOR[0]}, ${BLOB_COLOR[1]}, ${BLOB_COLOR[2]}, ${(isHover ? 90 : 50) / 255})`;
    drawingContext.fill();

    blendMode(BLEND);
    teardropPath(n.x, n.y, displayR);
    drawingContext.fillStyle = `rgba(${BLOB_COLOR[0]}, ${BLOB_COLOR[1]}, ${BLOB_COLOR[2]}, ${(isHover ? 210 : 140) / 255})`;
    drawingContext.fill();
  }

  // 연결선 — 노드 위에 한 번 더 (겹쳐도 안 가려지게), 알파 최소 10
  blendMode(ADD);
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      let a = nodes[i], b = nodes[j];
      let sim = tagSimilarity(a, b);
      if (sim <= 0) continue;
      let isSeriesMate = a.series && a.series === b.series;
      let boost = isSeriesMate ? 1.6 : 1;
      stroke(BLOB_COLOR[0], BLOB_COLOR[1], BLOB_COLOR[2], constrain(sim * 65 * boost, 10, 55));
      strokeWeight(constrain(sim * 1.6 * boost, 0.5, 1.5));
      line(a.x, a.y, b.x, b.y);
    }
  }
  noStroke();

  const hoverImg = document.getElementById('hover-img');
  const hoverCaption = document.getElementById('hover-caption');
  const hoverTitle = document.getElementById('hover-title');
  const hoverKeywords = document.getElementById('hover-keywords');

  if (hovered) {
    tooltip.innerText = hovered.title;
    tooltip.style.left = hovered.x + 'px';
    tooltip.style.top = hovered.y + 'px';
    tooltip.style.opacity = 1;
    document.body.style.cursor = 'pointer';

    if (hoverImg.src !== hovered.imgUrl) hoverImg.src = hovered.imgUrl;
    hoverImg.classList.add('active');

    hoverTitle.innerText = hovered.title;
    hoverKeywords.innerText = hovered.tags.map(t => "#" + t).join("  ");
    hoverCaption.classList.add('active');
  } else {
    tooltip.style.opacity = 0;
    hoverImg.classList.remove('active');
    hoverCaption.classList.remove('active');
    document.body.style.cursor = 'default';
  }
}

function positionCaption() {
  const photo = document.getElementById('hover-photo');
  const caption = document.getElementById('hover-caption');
  const rect = photo.getBoundingClientRect();
  caption.style.top = (rect.bottom + 12) + 'px';
  caption.style.right = (window.innerWidth - rect.right) + 'px';
  caption.style.maxWidth = rect.width + 'px';
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  positionCaption();
}

function mouseClicked() {
  for (let n of nodes) {
    if (dist(mouseX, mouseY, n.x, n.y) < n.r && n.link) {
      window.location.href = n.link;
      return;
    }
  }
}

window.addEventListener('load', positionCaption);
window.addEventListener('resize', positionCaption);
</script>

<svg style="position:absolute; width:0; height:0;">
  <filter id="goo-cursor">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="soft" />
  </filter>
</svg>

<script>
new p5(function (p) {
  let followerX, followerY;
  let followerVX = 0, followerVY = 0;
  const F_SPRING = 0.035;
  const F_DAMPING = 0.72;
  let followerTrail = [];
  const F_TRAIL_LENGTH = 6;
  const F_COLOR = [188, 228, 230];

  p.setup = function () {
    let canvas = p.createCanvas(window.innerWidth, window.innerHeight);
    p.pixelDensity(2);
    canvas.parent(document.body);
    canvas.id('cursor-layer');
    canvas.style('position', 'fixed');
    canvas.style('top', '0');
    canvas.style('left', '0');
    canvas.style('z-index', '7');
    canvas.style('pointer-events', 'none');
    canvas.style('filter', 'url(#goo-cursor)');
    followerX = p.width / 2;
    followerY = p.height / 2;
    p.frameRate(30);
  };

  p.draw = function () {
    p.clear();

    let ax = (p.mouseX - followerX) * F_SPRING;
    let ay = (p.mouseY - followerY) * F_SPRING;
    followerVX = (followerVX + ax) * F_DAMPING;
    followerVY = (followerVY + ay) * F_DAMPING;
    followerX += followerVX;
    followerY += followerVY;

    followerTrail.push({ x: followerX, y: followerY });
    if (followerTrail.length > F_TRAIL_LENGTH) followerTrail.shift();

    p.blendMode(p.ADD);
    p.noFill();
    p.strokeCap(p.ROUND);
    p.strokeJoin(p.ROUND);
    for (let i = 0; i < followerTrail.length - 1; i++) {
      let t = i / followerTrail.length;
      let a = followerTrail[i];
      let b = followerTrail[i + 1];
      p.stroke(F_COLOR[0], F_COLOR[1], F_COLOR[2], 65 * t);
      p.strokeWeight(26);
      p.line(a.x, a.y, b.x, b.y);
    }
    p.noStroke();

    let speed = p.mag(followerVX, followerVY);
    let angle = p.atan2(followerVY, followerVX);
    let stretch = p.constrain(speed * 0.22, 0, 10);
    let breathe = 20 + p.sin(p.frameCount * 0.02) * 3;

    p.push();
    p.translate(followerX, followerY);
    p.rotate(angle);
    p.fill(F_COLOR[0], F_COLOR[1], F_COLOR[2], 150);
    p.ellipse(0, 0, breathe + stretch, breathe - stretch * 0.5);
    p.pop();
  };

  p.windowResized = function () {
    p.resizeCanvas(window.innerWidth, window.innerHeight);
  };
});
</script>
