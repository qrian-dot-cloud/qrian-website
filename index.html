<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0A0D12;
    overflow: hidden;
    height: 100%;
  }
  canvas { display: block; }

  #gooey-layer {
    position: fixed;
    top: 0; left: 0;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;

  .logo {
    color: #E8ECEF;

  }

  .menu {
    display: flex;

  .menu li a {
    color: #C7D0D3;

    color: #C7D0D3;
    opacity: 0.55;
    letter-spacing: 0.03em;
    margin: 0;
  }

<body>

<svg style="position:absolute; width:0; height:0;">
  <filter id="goo">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="soft" />
  </filter>
</svg>

<div class="hero">
  <h1>Emotion through interface,<br>memory through resonance.</h1>
  <p>QRIAN — computational artist &amp; electronic musician</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
let blobs = [];
const NUM_BLOBS = 14;

let followerX, followerY;
let followerVX = 0, followerVY = 0;
const SPRING = 0.035;
const DAMPING = 0.72;
let trail = [];
const TRAIL_LENGTH = 6;

const BG = [10, 13, 18];
const BLOB_COLOR = [188, 228, 230];

function setup() {
  let canvas = createCanvas(windowWidth, windowHeight);
  pixelDensity(2);
  canvas.parent(document.body);
  canvas.style('position', 'fixed');
  canvas.style('top', '0');
  canvas.style('left', '0');
  canvas.id('gooey-layer');
  canvas.style('filter', 'url(#goo)');

  for (let i = 0; i < NUM_BLOBS; i++) {
    blobs.push(makeBlob());
  }

  followerX = width / 2;
  followerY = height / 2;

  frameRate(28);

  setTimeout(() => resizeCanvas(windowWidth, windowHeight), 150);
}

function makeBlob() {
  return {
    x: random(width),
    y: random(height),
    baseR: random(18, 42),
    noiseOffX: random(1000),
    noiseOffY: random(1000),
    breatheOffset: random(TWO_PI),
    driftSpeed: random(0.0009, 0.0018),
    breatheSpeed: random(0.003, 0.005)
  };
}

function draw() {
  blendMode(BLEND);
  background(BG[0], BG[1], BG[2]);
  noStroke();
  blendMode(ADD);
  fill(BLOB_COLOR[0], BLOB_COLOR[1], BLOB_COLOR[2], 130);

  for (let b of blobs) {
    b.x += (noise(b.noiseOffX) - 0.5) * 0.7;
    b.y += (noise(b.noiseOffY) - 0.5) * 0.7;
    b.noiseOffX += b.driftSpeed;
    b.noiseOffY += b.driftSpeed;

    if (b.x < -50) b.x = width + 50;
    if (b.x > width + 50) b.x = -50;
    if (b.y < -50) b.y = height + 50;
    if (b.y > height + 50) b.y = -50;

    let breathe = sin(frameCount * b.breatheSpeed + b.breatheOffset);
    let r = b.baseR + breathe * (b.baseR * 0.3);

    circle(b.x, b.y, r);
  }

  let ax = (mouseX - followerX) * SPRING;
  let ay = (mouseY - followerY) * SPRING;
  followerVX = (followerVX + ax) * DAMPING;
  followerVY = (followerVY + ay) * DAMPING;
  followerX += followerVX;
  followerY += followerVY;

  trail.push({ x: followerX, y: followerY });
  if (trail.length > TRAIL_LENGTH) trail.shift();

  noFill();
  strokeCap(ROUND);
  strokeJoin(ROUND);
  for (let i = 0; i < trail.length - 1; i++) {
    let t = i / trail.length;
    let a = trail[i];
    let b = trail[i + 1];
    stroke(BLOB_COLOR[0], BLOB_COLOR[1], BLOB_COLOR[2], 65 * t);
    strokeWeight(26);
    line(a.x, a.y, b.x, b.y);
  }
  noStroke();

  let speed = mag(followerVX, followerVY);
  let angle = atan2(followerVY, followerVX);
  let stretch = constrain(speed * 0.22, 0, 10);
  let breathe = 20 + sin(frameCount * 0.02) * 3;

  push();
  translate(followerX, followerY);
  rotate(angle);
  fill(BLOB_COLOR[0], BLOB_COLOR[1], BLOB_COLOR[2], 150);
  ellipse(0, 0, breathe + stretch, breathe - stretch * 0.5);
  pop();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
